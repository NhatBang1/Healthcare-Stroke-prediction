<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>StrokeGuard AI - Quên mật khẩu</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: "#ebfdf8",
            surface: "#ebfdf8",
            "surface-container-low": "#e5f8f2",
            "surface-container-lowest": "#ffffff",
            primary: "#005c55",
            "primary-container": "#0f766e",
            "on-primary": "#ffffff",
            "on-surface": "#0e1e1b",
            "on-surface-variant": "#3e4947",
            outline: "#6e7977",
            "outline-variant": "#bdc9c6"
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; }
    .glass-panel { background: rgba(255, 255, 255, 0.72); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(15, 118, 110, 0.16); }
    .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; }
    .fill-icon { font-variation-settings: "FILL" 1; }
  </style>
</head>
<body class="min-h-screen bg-background text-on-surface">
  <main class="mx-auto flex min-h-screen max-w-3xl items-center px-4 py-6 md:px-8">
    <section class="glass-panel w-full rounded-[28px] p-6 md:p-8">
      <div class="flex items-center gap-3">
        <div class="flex h-11 w-11 items-center justify-center rounded-full bg-primary-container text-on-primary shadow-sm">
          <span class="material-symbols-outlined fill-icon">lock_reset</span>
        </div>
        <div>
          <p class="text-xs font-semibold uppercase tracking-[0.2em] text-on-surface-variant">Account access</p>
          <h1 class="text-2xl font-bold text-primary">Quên mật khẩu</h1>
        </div>
      </div>

      <p class="mt-4 max-w-2xl text-sm leading-6 text-on-surface-variant">
        Trang này thay cho link placeholder trước đây. Khi backend có endpoint reset thật, tôi sẽ nối form vào API gửi email hoặc tạo token đặt lại mật khẩu.
      </p>

      <div class="mt-6 grid gap-4 md:grid-cols-[1fr_auto]">
        <input class="w-full rounded-2xl border border-outline-variant/50 bg-surface-container-lowest px-4 py-3 text-sm outline-none transition focus:border-primary" type="email" placeholder="you@example.com" />
        <button class="rounded-2xl bg-primary-container px-5 py-3.5 text-sm font-bold text-on-primary shadow-sm transition hover:bg-primary" type="button">Gửi link đặt lại</button>
      </div>

      <div class="mt-5 flex flex-wrap gap-3">
        <a class="rounded-full border border-outline-variant/40 px-4 py-2 text-sm font-semibold text-primary transition-colors hover:bg-surface-container-low" href="/auth.html">Về đăng nhập</a>
        <a class="rounded-full border border-outline-variant/40 px-4 py-2 text-sm font-semibold text-primary transition-colors hover:bg-surface-container-low" href="/admin-settings.html">Cài đặt</a>
      </div>
    </section>
  </main>
</body>
</html>
