services:
  frontend:
    build:
      context: ./fe
    container_name: strokeguard-frontend
    restart: unless-stopped

  backend:
    build:
      context: ./be
    container_name: strokeguard-backend
    restart: unless-stopped
    env_file:
      - ./be/.env
    ports:
      - "8000:8000"

  caddy:
    image: caddy:2.8-alpine
    container_name: strokeguard-caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
